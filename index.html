<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h2 { margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 12px; }
        .wa-link { color: #25D366; text-decoration: none; font-weight: bold; }
        .btn { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #ccc; }

        /* Modal Styling */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; text-align: center; width: 280px; }
        .close-btn { margin-top: 15px; padding: 8px 20px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-card">
    <form id="loginForm">
        <h2>Login</h2>
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="user" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="pass" required>
        </div>
        <div class="options">
            <label><input type="checkbox" id="autoLogin"> Auto Login</label>
            <a href="https://wa.me/919362666588" class="wa-link" target="_blank">Forgot Password?</a>
        </div>
        <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>
</div>

<div class="modal-overlay" id="errorModal">
    <div class="modal-content">
        <h3 style="color:red">Not Found</h3>
        <p>User credentials not in database.</p>
        <button class="close-btn" onclick="closeModal()">Try Again</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzxcQi1YOZGk8dhDzKSVfInLUcFFcxUQbTF_u41AnxQTSClZdouqSVz1Pft9ZbNOzQx/exec'; // PASTE YOUR GOOGLE DEPLOYMENT URL HERE
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    // Auto-login storage check
    window.onload = () => {
        if (localStorage.getItem('saved_user')) {
            document.getElementById('user').value = localStorage.getItem('saved_user');
            document.getElementById('pass').value = localStorage.getItem('saved_pass');
            document.getElementById('autoLogin').checked = true;
        }
    };

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        loginBtn.innerText = "Checking...";
        loginBtn.disabled = true;

        const user = document.getElementById('user').value;
        const pass = document.getElementById('pass').value;
        const auto = document.getElementById('autoLogin').checked;

        // Fetch check from Google Sheets
        fetch(`${scriptURL}?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`)
            .then(response => response.json())
            .then(data => {
                if (data.result === "found") {
                    if (auto) {
                        localStorage.setItem('saved_user', user);
                        localStorage.setItem('saved_pass', pass);
                    } else {
                        localStorage.clear();
                    }
                    alert("Welcome " + user + "!");
                } else {
                    document.getElementById('errorModal').style.display = 'flex';
                }
            })
            .catch(error => alert("Database Error! check script URL"))
            .finally(() => {
                loginBtn.innerText = "Sign In";
                loginBtn.disabled = false;
            });
    });

    function closeModal() { document.getElementById('errorModal').style.display = 'none'; }
</script>

</body>
</html>
