<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 90%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #89b4fa; }
        .wa { display: block; text-align: right; font-size: 12px; color: #25D366; text-decoration: none; margin-bottom: 20px; font-weight: bold; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; }
        .m-content { background: white; padding: 20px; border-radius: 8px; text-align: center; width: 280px; }
    </style>
</head>
<body>

<div class="card">
    <form id="loginForm">
        <h2 style="text-align:center">Login</h2>
        <input type="text" id="u" placeholder="Username" required>
        <input type="password" id="p" placeholder="Password" required>
        <label style="font-size:12px"><input type="checkbox" id="auto"> Auto Login</label>
        <a href="https://wa.me/919362666588" class="wa">Forgot Password?</a>
        <button type="submit" class="btn" id="b">Sign In</button>
    </form>
</div>

<div class="modal" id="m">
    <div class="m-content">
        <h3 style="color:red">Not Found</h3>
        <p>Credentials do not match.</p>
        <button onclick="document.getElementById('m').style.display='none'">Try Again</button>
    </div>
</div>

<script>
    const api = 'https://script.google.com/macros/s/AKfycbzxcQi1YOZGk8dhDzKSVfInLUcFFcxUQbTF_u41AnxQTSClZdouqSVz1Pft9ZbNOzQx/exec';

    window.onload = () => {
        if(localStorage.getItem('un')) {
            document.getElementById('u').value = localStorage.getItem('un');
            document.getElementById('p').value = localStorage.getItem('pw');
            document.getElementById('auto').checked = true;
        }
    };

    document.getElementById('loginForm').onsubmit = (e) => {
        e.preventDefault();
        const btn = document.getElementById('b');
        btn.innerText = "Checking...";
        btn.disabled = true;

        const user = document.getElementById('u').value;
        const pass = document.getElementById('p').value;

        fetch(`${api}?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`)
            .then(res => res.json())
            .then(data => {
                if(data.result === "found") {
                    if(document.getElementById('auto').checked) {
                        localStorage.setItem('un', user);
                        localStorage.setItem('pw', pass);
                    } else { localStorage.clear(); }
                    alert("Success!");
                } else { document.getElementById('m').style.display = 'flex'; }
            })
            .catch(() => alert("Error connecting to database"))
            .finally(() => { btn.innerText = "Sign In"; btn.disabled = false; });
    };
</script>
</body>
</html>
